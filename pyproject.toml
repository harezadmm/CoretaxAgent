[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "coretax-ai-agent"
version = "0.1.0"
description = "Prototype AI agent berbasis knowledge base untuk layanan informasi Coretax."
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12",
  "fastapi>=0.115",
  "ftfy>=6.2",
  "markdownify>=0.14",
  "openai>=1.60",
  "pypdf>=5.1",
  "python-dotenv>=1.0",
  "uvicorn[standard]>=0.34",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28",
  "pymupdf>=1.25",
  "pytest>=8.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["knowledge*", "tests*"]
